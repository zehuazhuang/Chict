name: chict
description: "A new Flutter project."
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  dotted_line: ^3.2.3
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.3
  bot_toast: ^4.1.3
  image_picker: 1.2.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  video_player: ^2.10.1
  in_app_purchase: 3.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  dio: ^5.9.0
  encrypt: ^5.0.0
  convert: ^3.1.2
  loading_animation_widget: ^1.3.0
  record: 5.1.2
  record_darwin: 1.1.2
  record_platform_interface: 1.2.0
  path_provider: ^2.1.5
  animate_do: ^4.2.0
  flutter_keychain: ^2.5.0
  system_keyboard_languages: 0.0.2
  device_info_plus: ^12.2.0
  vpn_detector: 1.2.0
  screen_protector: ^1.4.2+1
  devicelocale: 0.8.2
  facebook_app_events: ^0.20.1
  flutter_native_timezone: 2.0.0
  http: 1.5.0
  flutter_local_notifications: 19.5.0
  adjust_sdk: 5.1.1

  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: truedevicelocale
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/images/ChictLogo.png"

flutter_native_splash:
  background_image: "assets/images/ZXNJCUIQWQ.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/video/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/robotoNZXCWZ.ttf
    - family: Abel
      fonts:
        - asset: assets/fonts/robotoNZXCWZ.ttf
